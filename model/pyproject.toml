[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-use-model"
version = "0.1.0"
description = "Synthetic-only validation component for the digital-use study"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "lightgbm>=4.6,<5",
    "joblib>=1.4,<2",
    "PyYAML>=6,<7",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
