name: backend

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usage}
      POSTGRES_USER: ${POSTGRES_USER:-usage_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usage_api} -d ${POSTGRES_DB:-usage}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/usage}
      DB_USERNAME: ${POSTGRES_USER:-usage_api}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in root .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in root .env}
      LOCAL_KEYSTORE_PATH: /app/data/dev-keystore.p12
      LOCAL_KEYSTORE_PASSWORD: ${LOCAL_KEYSTORE_PASSWORD:?Set LOCAL_KEYSTORE_PASSWORD in root .env}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      - local_keys:/app/data

  frontend:
    build: ./registration-frontend
    depends_on:
      - api
    environment:
      CONTAINER_MODE: "true"
      BACKEND_URL: ${BACKEND_URL:-http://api:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

  synthetic-dashboard-job:
    build: ./model
    command: ["python", "scripts/run_usage_patterns.py", "--skip-real", "--synthetic-csv", "/data", "--output-dir", "/output"]
    volumes:
      - ./model/data/synthetic:/data:ro
      - synthetic_dashboard_output:/output

  synthetic-dashboard:
    image: nginx:1.27-alpine
    depends_on:
      synthetic-dashboard-job:
        condition: service_completed_successfully
    volumes:
      - synthetic_dashboard_output:/usr/share/nginx/html:ro
    ports:
      - "${SYNTHETIC_DASHBOARD_HOST_PORT:-8091}:80"

  # One-shot loader: (re)loads the committed synthetic CSVs into the separate `synthetic` schema.
  synthetic-loader:
    image: postgres:16.4
    profiles: ["model"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-usage}
      PGUSER: ${POSTGRES_USER:-usage_api}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    working_dir: /data
    volumes:
      - ./model/data/synthetic:/data:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "load.sql"]

  # Internal health API; it does not accept participant data or serve scoring.
  model-api:
    build: ./model
    profiles: ["model"]
    environment:
      APP_ENV: ${MODEL_APP_ENV:-dev}
    ports:
      - "${MODEL_API_HOST_PORT:-8000}:8000"
    command: ["uvicorn", "model_component.api:app", "--host", "0.0.0.0", "--port", "8000"]

  # One-shot job: reads daily usage through a read-only role, writes the dashboard to /output.
  # Run with: docker compose --profile model run --rm model-job
  model-job:
    build: ./model
    profiles: ["model"]
    depends_on:
      postgres:
        condition: service_healthy
      synthetic-loader:
        condition: service_completed_successfully
    environment:
      MODEL_DB_HOST: postgres
      MODEL_DB_PORT: "5432"
      MODEL_DB_NAME: ${POSTGRES_DB:-usage}
      MODEL_DB_USER: ${MODEL_DB_USER:-usage_model_reader}
      MODEL_DB_PASSWORD: ${MODEL_DB_PASSWORD:-}
    volumes:
      - pattern_output:/output

  # Serves the dashboard written by model-job. Starts without the job having run.
  pattern-dashboard:
    image: nginx:1.27-alpine
    profiles: ["model"]
    volumes:
      - pattern_output:/usr/share/nginx/html:ro
    ports:
      - "${PATTERN_DASHBOARD_HOST_PORT:-8090}:80"

volumes:
  postgres_data:
  local_keys:
  pattern_output:
  synthetic_dashboard_output:
