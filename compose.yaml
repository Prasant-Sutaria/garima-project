name: backend

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: usage
      POSTGRES_USER: usage_api
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usage_api -d usage"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/usage
      DB_USERNAME: usage_api
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in your shell}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your shell}
      LOCAL_KEYSTORE_PATH: /app/data/dev-keystore.p12
      LOCAL_KEYSTORE_PASSWORD: ${LOCAL_KEYSTORE_PASSWORD:?Set LOCAL_KEYSTORE_PASSWORD in your shell}
    ports:
      - "8080:8080"
    volumes:
      - local_keys:/app/data

  frontend:
    build: ./registration-frontend
    depends_on:
      - api
    environment:
      CONTAINER_MODE: "true"
      BACKEND_URL: ${BACKEND_URL:-http://api:8080}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  local_keys:
